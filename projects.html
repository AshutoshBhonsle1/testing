<style>
:root {
  --ceramic: #d9d4ca;
  --ceramic-hi: #e9e5dc;
  --umber: #16130f;
  --night: #050507;
  --paper: #f3f0ea;
  --ultra: #ee1e1e;
  --ultra-deep: #cc1616;
  --font-ui: 'Sora', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ceramic);
  color: var(--umber);
  font-family: var(--font-ui);
  overflow-x: clip;
}
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- Header ---------- */
.hdr {
  --ink: var(--umber);
  --glass: rgba(217, 212, 202, 0.55);
  --glass-o: 0;
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  color: var(--ink);
  transition: color 0.3s ease;
}
.hdr[data-scene="2"] { --ink: var(--paper); --glass: rgba(7, 5, 5, 0.5); }
.hdr[data-scene="3"] { --ink: var(--paper); --glass: rgba(204, 22, 22, 0.5); }
.hdr::before {
  content: ""; position: absolute; inset: 0 0 -22px 0; z-index: -1; pointer-events: none;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.25);
  backdrop-filter: blur(14px) saturate(1.25);
  -webkit-mask-image: linear-gradient(#000 62%, transparent);
  mask-image: linear-gradient(#000 62%, transparent);
  opacity: var(--glass-o);
}
.hdr-in {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px;
  padding-top: 18px; padding-bottom: 18px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.name {
  font-weight: 700; font-size: 24px; letter-spacing: 0.015em; line-height: 1;
  padding: 10px 0;
}
.nav { display: flex; align-items: center; gap: 2px; min-width: 0; }
.nl {
  position: relative; font-size: 16.5px; font-weight: 500; letter-spacing: 0.02em;
  padding: 11px 14px; border-radius: 8px; opacity: 0.9;
  transition: opacity 0.2s ease, background-color 0.2s ease;
}
.nl::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: 6px; height: 1px; background: currentColor;
  transform: scaleX(0); transform-origin: left; transition: transform 0.25s ease;
}
.nl:hover, .nl:focus-visible { opacity: 1; }
.nl:hover::after, .nl:focus-visible::after { transform: scaleX(1); }
.sep { width: 1px; height: 22px; background: currentColor; opacity: 0.25; margin: 0 8px; }
.ib {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; opacity: 0.85;
  transition: opacity 0.2s ease, background-color 0.2s ease;
}
.ib:hover, .ib:focus-visible { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }
.ico { width: 22px; height: 22px; fill: currentColor; display: block; }


/* ---------- Placeholder page ---------- */
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: var(--ultra-deep); color: var(--paper); }
.soon-page {
  flex: 1; display: grid; place-items: center; text-align: center;
  padding: 120px 24px 80px;
  background: radial-gradient(120% 90% at 50% 38%, #f62727 0%, var(--ultra) 52%, var(--ultra-deep) 100%);
}
.soon-page p {
  margin: 0; font-family: var(--font-serif); font-style: italic; font-weight: 300;
  font-size: clamp(26px, 4vw, 42px); letter-spacing: 0.01em; color: var(--paper);
}
.nl[aria-current="page"]::after { transform: scaleX(1); }
.nl[aria-current="page"] { opacity: 1; }

/* ---------- Footer ---------- */
.foot {
  position: relative; z-index: 3; color: var(--paper); background: var(--ultra-deep);
  border-top: 1px solid rgba(255, 255, 255, 0.22);
}
.foot-in {
  max-width: 1120px; margin: 0 auto; display: grid; gap: 40px 48px; grid-template-columns: 1.4fr 1fr 1fr;
  padding-top: 64px; padding-bottom: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.foot h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
.foot p { margin: 0; max-width: 34ch; font-size: 14px; line-height: 1.6; opacity: 0.78; }
.foot h3 { margin: 0 0 14px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.foot li a { font-size: 14.5px; opacity: 0.9; display: inline-flex; align-items: center; gap: 10px; transition: opacity 0.2s ease; }
.foot li a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.foot .ico { width: 16px; height: 16px; }
.foot-base {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px;
  padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.18); font-size: 12.5px; opacity: 0.72;
}

@media (max-width: 760px) {
  .foot-in { grid-template-columns: 1fr 1fr; padding-top: 48px; }
  .foot-in > div:first-child { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .name { font-size: 22px; padding: 4px 0; }
  .nav { width: 100%; justify-content: space-between; }
  .nl { font-size: 16.5px; padding: 12px 12px 12px 0; }
  .nl::after { left: 0; }
  .sep { display: none; }
  .nav .ib:first-of-type { margin-left: auto; }
  .hdr-in { padding-top: 14px; padding-bottom: 8px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .nl::after { transition: none; }
}
</style>
</head>
